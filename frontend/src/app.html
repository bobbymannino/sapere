<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link rel="preload" href="/fonts/Figtree.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-theme="catppuccin">
    <noscript>
      <div
        role="alert"
        style="
          margin: 0;
          padding: 1rem;
          border-bottom: 1px solid #f9e2af;
          background: #fef3c7;
          color: #3c3c3c;
          font-family: Figtree, ui-sans-serif, system-ui, sans-serif;
          font-size: 1rem;
          font-weight: 600;
          line-height: 1.5;
          text-align: center;
        "
      >
        JavaScript is required to use this website. Please enable JavaScript in your browser and reload the page.
      </div>
    </noscript>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
