name: sapere

services:
  postgres:
    image: postgres:18-alpine
    container_name: sapere-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sapere
    ports:
      - "5231:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend

volumes:
  postgres_data:
    name: sapere_postgres_data

networks:
  backend:
    name: sapere_backend
