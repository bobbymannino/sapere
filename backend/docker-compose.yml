services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sapere
    ports:
      - "5231:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sapere

volumes:
  postgres_data:

networks:
  sapere:
