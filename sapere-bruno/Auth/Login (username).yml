info:
  name: Login (username)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login/email"
  body:
    type: json
    data: |-
      {
        "username": "manninobobby",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300) {
          const body = res.getBody(); 
          if (body?.token) {
            bru.setVar("token", body.token);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
