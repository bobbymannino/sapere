name: sapere

services:
  postgres:
    image: postgres:18-alpine
    container_name: sapere-postgres
    restart: unless-stopped
    ports:
      - "54562:5432"
    environment:
      POSTGRES_DB: sapere
      POSTGRES_USER: sapere
      POSTGRES_PASSWORD: sapere
    volumes:
      - sapere-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapere -d sapere"]
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: sapere-dragonfly
    restart: unless-stopped
    ports:
      - "64702:6379"
    volumes:
      - sapere-dragonfly-data:/data

  rustrak-server:
    image: rustrak/rustrak-server:latest
    container_name: sapere-rustrak-server
    ports:
      - "8080:8080"
    volumes:
      - rustrak_data:/data
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - CREATE_SUPERUSER=${CREATE_SUPERUSER}
    restart: unless-stopped

  rustrak-ui:
    image: rustrak/rustrak-ui:latest
    container_name: sapere-rustrak-ui
    ports:
      - "3003:3000"
    environment:
      - RUSTRAK_API_URL=http://rustrak-server:8080
    depends_on:
      - rustrak-server
    restart: unless-stopped

volumes:
  sapere-postgres-data:
  sapere-dragonfly-data:
  rustrak_data:
